# Optional host access to Docker PostgreSQL and Redis for local CLI tools.
#
# docker compose -f docker-compose.yml \
#   -f infrastructure/docker/compose.ports.yml up -d postgres redis
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
